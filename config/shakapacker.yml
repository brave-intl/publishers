# Note: You must restart bin/webpacker-dev-server for changes to take effect.
#
# js-yaml v4+ removed support for the `<<:` merge key that YAML normally uses
# to inherit shared keys from an anchor. Shakapacker parses this file with
# js-yaml, so each environment below is fully inlined instead of extending a
# shared `default:` anchor. Plain aliases (e.g. `*extensions`) still work.

development:
  source_path: app/javascript
  source_entry_path: packs
  public_output_path: packs
  cache_path: tmp/cache/shakapacker
  nested_entries: true
  css_extract_ignore_order_warnings: false
  public_root_path: public
  shakapacker_compile_output: true
  shakapacker_precompile: true
  cache_manifest: false
  extensions: &extensions
    - .coffee
    - .erb
    - .js
    - .jsx
    - .ts
    - .tsx
    - .vue
    - .sass
    - .scss
    - .css
    - .png
    - .svg
    - .gif
    - .jpeg
    - .jpg
  shakapacker_loader: "babel"
  ensure_consistent_versioning: true
  # Extra module lookup paths; must be an array even if empty because
  # shakapacker spreads it without an undefined guard (rules/jscommon.js).
  additional_paths: []
  compile: true
  compiler_strategy: mtime

  # Reference: https://webpack.js.org/configuration/dev-server/
  # Keys not described there are documented inline and in https://github.com/shakacode/shakapacker/
  dev_server:
    https: true
    host: localhost
    port: 3035
    public: localhost:3035
    hmr: false
    inline_css: true
    client:
      overlay: true
    overlay: true
    compress: true
    disable_host_check: true
    use_local_ip: false
    quiet: false
    # Note that apps that do not check the host are vulnerable to DNS rebinding attacks
    allowed_hosts: "all"
    pretty: true
    headers:
      "Access-Control-Allow-Origin": "*"
    static:
      watch:
        ignored: "/node_modules/"

test:
  source_path: app/javascript
  source_entry_path: packs
  # Compile test packs to a separate directory
  public_output_path: packs-test
  cache_path: tmp/cache/shakapacker
  nested_entries: true
  css_extract_ignore_order_warnings: false
  public_root_path: public
  shakapacker_compile_output: true
  shakapacker_precompile: true
  cache_manifest: false
  extensions: *extensions
  shakapacker_loader: "babel"
  ensure_consistent_versioning: true
  # Extra module lookup paths; must be an array even if empty because
  # shakapacker spreads it without an undefined guard (rules/jscommon.js).
  additional_paths: []
  compiler_strategy: digest
  compile: false

production:
  source_path: app/javascript
  source_entry_path: packs
  public_output_path: packs
  cache_path: tmp/cache/shakapacker
  nested_entries: true
  css_extract_ignore_order_warnings: false
  public_root_path: public
  shakapacker_compile_output: true
  shakapacker_precompile: true
  # Production caches manifest.json for performance
  cache_manifest: true
  extensions: *extensions
  shakapacker_loader: "babel"
  ensure_consistent_versioning: true
  # Extra module lookup paths; must be an array even if empty because
  # shakapacker spreads it without an undefined guard (rules/jscommon.js).
  additional_paths: []
  compiler_strategy: digest
  # Production depends on precompilation of packs prior to booting for performance.
  compile: false
